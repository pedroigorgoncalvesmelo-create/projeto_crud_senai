{% extends 'base.html' %}

{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gerenciamento de Clientes</h2>
</div>

<!-- Form de Cadastro -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">Cadastrar Novo Cliente</div>
    <div class="card-body">
        <form action="/clientes/salvar" method="POST" class="row g-3">
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome Razão Social</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="col-md-6">
                <label for="cpf_cnpj" class="form-label">CPF / CNPJ (Único)</label>
                <input type="text" class="form-control" id="cpf_cnpj" name="cpf_cnpj" required placeholder="Apenas números">
            </div>
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-success">Salvar Cliente</button>
            </div>
        </form>
    </div>
</div>

<!-- Tabela de Listagem -->
<div class="card">
    <div class="card-header bg-dark text-white">Lista de Clientes</div>
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF / CNPJ</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for cli in clientes %}
                <tr>
                    <td>{{ cli.id }}</td>
                    <td>{{ cli.nome }}</td>
                    <td>{{ cli.cpf_cnpj }}</td>
                    <td>
                        <a href="/clientes/deletar/{{ cli.id }}" class="btn btn-danger btn-sm" onclick="return confirm('Excluir este cliente?')">Excluir</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center text-muted">Nenhum cliente cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
